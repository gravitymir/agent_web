[package]
name = "agent_web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Native agent engine: file tools.
glob = "0.3"
walkdir = "2"
regex = "1"
# Interactive startup menu (arrow-key engine/port picker); only used on a TTY.
dialoguer = { version = "0.11", default-features = false }
# Built-in access gate (optional, CWI_AUTH=1): HMAC-signed session cookies +
# hashed one-time access codes. Pure-Rust so the musl/container build stays clean.
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
# Audited constant-time comparison for auth codes / cookie signatures.
subtle = "2"
# Zip the workspace for the "download workspace" button. Pure-Rust deflate
# (miniz_oxide) so the musl/guest build stays clean — no C deps.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Smaller release binary: strip symbols + thin LTO (most of the size win without
# the long full-LTO/1-codegen-unit compile times, since we rebuild often).
[profile.release]
strip = true
lto = "thin"
